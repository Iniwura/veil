name: UNVEIL Branch Formatter

on:
  push:
    branches:
      - feat/unveil-winner-build

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/unveil-winner-build
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
          cache: npm
      - run: npm ci
      - name: Format UNVEIL documentation
        run: npx prettier --write docs/PRODUCTION_YIELD_PATH.md docs/UNVEIL_AUTOMATION.md
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            echo "Documentation already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PRODUCTION_YIELD_PATH.md docs/UNVEIL_AUTOMATION.md
          git commit -m "Format UNVEIL documentation"
          git push origin HEAD:feat/unveil-winner-build
