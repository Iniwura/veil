name: Prize Format Debug

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  format-prize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: "false"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx prettier contracts/VeilPrizeVault.sol test/VeilPrizeVault.ts --write
      - run: cat contracts/VeilPrizeVault.sol
      - run: cat test/VeilPrizeVault.ts
      - run: git diff --exit-code -- contracts/VeilPrizeVault.sol test/VeilPrizeVault.ts
