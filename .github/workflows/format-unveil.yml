name: Format UNVEIL branch

on:
  push:
    branches:
      - feat/unveil-winner-build

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/unveil-winner-build
          persist-credentials: true

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.x

      - name: Install dependencies
        run: npm ci

      - name: Format UNVEIL build files
        run: >-
          npx prettier --write
          deploy/deploy.ts
          frontend/src/veilClient.ts
          scripts/sepolia-next-round.ts
          scripts/sepolia-smoke.ts
          test/VeilPool.ts
          .github/workflows/format-unveil.yml

      - name: Commit formatter output
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deploy.ts frontend/src/veilClient.ts scripts/sepolia-next-round.ts scripts/sepolia-smoke.ts test/VeilPool.ts .github/workflows/format-unveil.yml
          git commit -m "Format UNVEIL winner build"
          git push origin HEAD:feat/unveil-winner-build
