name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - "scripts/verify-frontend-dist.mjs"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - "scripts/verify-frontend-dist.mjs"
      - ".github/workflows/frontend.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npm run build
      - run: npm run verify:dist
      - run: npm audit --omit=dev
