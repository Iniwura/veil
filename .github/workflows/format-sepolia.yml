name: Format UNVEIL winner build

on:
  push:
    branches:
      - feat/unveil-winner-build

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/unveil-winner-build
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: >-
          npx prettier
          contracts/VeilPool.sol
          scripts/sepolia-next-round.ts
          scripts/sepolia-smoke.ts
          scripts/sepolia-sync-yield.ts
          test/VeilYieldTiming.ts
          --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            contracts/VeilPool.sol \
            scripts/sepolia-next-round.ts \
            scripts/sepolia-smoke.ts \
            scripts/sepolia-sync-yield.ts \
            test/VeilYieldTiming.ts
          git commit -m "Format UNVEIL winner build"
          git push origin HEAD:feat/unveil-winner-build
