name: Format Sepolia smoke

on:
  push:
    branches:
      - feat/sepolia-smoke

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sepolia-smoke
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx prettier scripts/sepolia-smoke.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/sepolia-smoke.ts
          git commit -m "Format Sepolia smoke script"
          git push origin HEAD:feat/sepolia-smoke
