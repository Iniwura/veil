name: Format final submission files

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - run: npm ci
      - run: npx prettier docs/DEMO_SCRIPT.md docs/UNVEIL_V4_LIVE_RESULT.md scripts/v4-keeper.ts --write
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/DEMO_SCRIPT.md docs/UNVEIL_V4_LIVE_RESULT.md scripts/v4-keeper.ts
          git commit -m "Format final submission files"
          git push origin HEAD:main
