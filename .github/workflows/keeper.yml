name: UNVEIL Keeper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unveil-v4-keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HARDHAT_VAR_MNEMONIC: ${{ secrets.UNVEIL_KEEPER_MNEMONIC }}
      UNVEIL_V4_POOL_ADDRESS: "0xCC7d4642557FfE810a77D2CEce0206211d15aE57"
      UNVEIL_V4_SNAPSHOT_BATCHER_ADDRESS: "0xA46DCDE4C37C107d9B9333cBE2b0F117597D228b"
      UNVEIL_V4_DRAW_BATCHER_ADDRESS: "0xb0Da69Bb79746b2f7f568D612F38B4fa77d6Ca04"
      UNVEIL_V4_PRIZE_VAULT_ADDRESS: "0x0f84CE3060aB79de3eCE59C5c9f4a64d642D101C"
      UNVEIL_V4_MANAGER_ADDRESS: "0x2bA25db644515af6Bb731025e71EE493B9D5d4Db"
      UNVEIL_V4_KEEPER_FROM_BLOCK: "11625094"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: "false"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.x
          cache: npm

      - uses: foundry-rs/foundry-toolchain@82dee4ba654bd2146511f85f0d013af94670c4de # v1.4.0
        with:
          version: stable

      - name: Install dependencies
        run: npm ci

      - name: Run permissionless keeper cycle with bounded retries
        shell: bash
        run: |
          attempts=3
          for attempt in $(seq 1 "$attempts"); do
            echo "Keeper attempt $attempt/$attempts"

            set +e
            timeout --signal=TERM 4m npm run keeper:v4:sepolia
            status=$?
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            elif [ "$status" -eq 124 ] || [ "$status" -eq 143 ]; then
              echo "Keeper attempt $attempt timed out after 4 minutes."
            else
              echo "Keeper attempt $attempt exited with status $status."
            fi

            if [ "$attempt" -eq "$attempts" ]; then
              echo "Keeper failed after $attempts attempts. A later scheduled run can retry safely."
              exit 1
            fi

            echo "Retrying in 20 seconds..."
            sleep 20
          done
