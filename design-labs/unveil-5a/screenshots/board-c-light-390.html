<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>c-light-390</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 20px;
        background: #e9eeeb;
        color: #1a251e;
        font:
          13px Arial,
          sans-serif;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 12px;
      }
      p {
        line-height: 1.5;
      }
      a {
        color: inherit;
      }
      main {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        width: 840px;
      }
      figure {
        margin: 0;
        min-width: 0;
        background: #dae2dc;
      }
      img {
        display: block;
        width: 100%;
        height: auto;
      }
      figcaption {
        padding: 8px;
        font-size: 10px;
        line-height: 1.3;
      }
      .tiles {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }
      .mobile .tiles {
        grid-template-columns: 1fr;
      }
      .links {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 16px 0;
      }
      .full {
        max-width: 1400px;
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
      .full img {
        height: auto;
      }
      @media (max-width: 900px) {
        .full {
          grid-template-columns: 1fr;
        }
        main {
          width: 100%;
          grid-template-columns: repeat(2, 1fr);
        }
      }
    </style>
  </head>
