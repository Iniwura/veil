    <meta charset="UTF-8" />

    <meta name="theme-color" content="#080806" />
    <meta name="description" content="UNVEIL is private prize savings powered by fully homomorphic encryption." />

    <meta property="og:description" content="Private prize savings powered by fully homomorphic encryption." />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="UNVEIL — Save privately. Win verifiably." />
    <meta name="twitter:description" content="Encrypted to everyone. Unveiled only to you." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (() => {
        const stored = window.localStorage.getItem("unveil.theme.v1");
        const theme = stored === "light" || stored === "dark" ? stored : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>UNVEIL — Save privately. Win verifiably.</title>
  </head>
  <body>
    <div id="root"></div>
    <script src="https://cdn.zama.org/relayer-sdk-js/0.4.1/relayer-sdk-js.umd.cjs" type="text/javascript"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
