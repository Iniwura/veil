    <script>
      (() => {
        const stored = window.localStorage.getItem("unveil.theme.v1");
        const theme = stored === "light" || stored === "dark" ? stored : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <title>UNVEIL — Save privately. Win verifiably.</title>
